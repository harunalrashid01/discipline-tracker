{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Discipline Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">

      <!-- Logo / Title -->
      <div class="login-header">
        <div class="login-logo">🔥</div>
        <h1 class="login-title">Discipline Tracker</h1>
        <p class="login-subtitle">Your daily accountability system</p>
      </div>

      <!-- Form -->
      <form method="post" class="login-form" id="login-form">
        {% csrf_token %}

        {% if form.errors %}
        <div class="login-error">
          Invalid username or password. Try again.
        </div>
        {% endif %}

        <div class="form-group">
          <label class="form-label" for="id_username">Username</label>
          <input
            type="text"
            name="username"
            id="id_username"
            class="form-input"
            autocomplete="username"
            autofocus
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="id_password">Password</label>
          <input
            type="password"
            name="password"
            id="id_password"
            class="form-input"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="btn-primary btn-login" id="login-btn">
          Enter →
        </button>
      </form>

    </div>
  </div>

</body>
</html>
